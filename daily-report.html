<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานประจำวัน</title>
<style>
  body{font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;font-size:20px;line-height:1.6;
       max-width:640px;margin:0 auto;padding:16px;background:#f4f6f8;color:#1a1a1a}
  h1{font-size:26px;margin:8px 0 16px;text-align:center}
  label{display:block;font-weight:700;margin:18px 0 6px}
  input,textarea{width:100%;font:inherit;padding:12px;border:2px solid #c9d2da;
       border-radius:10px;box-sizing:border-box;background:#fff}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus{border-color:#1565c0;outline:none}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button{font:inherit;font-weight:700;padding:14px;border:0;border-radius:10px;
       background:#1565c0;color:#fff;width:100%;margin-top:20px;cursor:pointer}
  button:active{background:#0d47a1}
  .quick{background:#e3eaf1;color:#1a1a1a;font-size:17px;padding:8px 14px;width:auto;
       margin:6px 6px 0 0;border-radius:20px}
  .alt{background:#e3eaf1;color:#1a1a1a;margin-top:12px}
  .alt:active{background:#c9d2da}
  .hint{font-size:16px;color:#5a6570;margin-top:4px}
  #ok{text-align:center;color:#1b7f3b;font-weight:700;height:24px;margin-top:10px}
</style>
</head>
<body>

<h1>📋 รายงานประจำวัน</h1>

<label for="project">ชื่อโครงการ</label>
<input id="project" placeholder="เช่น อาคารสำนักงาน ABC">

<div class="row">
  <div>
    <label for="name">ชื่อ</label>
    <input id="name" placeholder="ชื่อของคุณ">
  </div>
  <div>
    <label for="date">วันที่</label>
    <input id="date" type="date">
  </div>
</div>

<label for="today">1. สิ่งที่ทำไปวันนี้</label>
<textarea id="today" placeholder="เช่น&#10;- ตรวจงานเสาชั้น 3&#10;- ประชุมกับผู้รับเหมา"></textarea>

<label for="tomorrow">2. สิ่งที่จะทำพรุ่งนี้</label>
<textarea id="tomorrow" placeholder="เช่น&#10;- เทคอนกรีตพื้นชั้น 3"></textarea>

<label for="problem">3. ปัญหาที่พบ</label>
<textarea id="problem" placeholder="ถ้าไม่มี กดปุ่มด้านล่าง"></textarea>
<div>
  <button class="quick" onclick="setP('ไม่มี')">ไม่มีปัญหา</button>
  <button class="quick" onclick="setP('ฝนตก ทำงานไม่ได้')">ฝนตก</button>
  <button class="quick" onclick="setP('รอวัสดุ')">รอวัสดุ</button>
  <button class="quick" onclick="setP('คนงานไม่พอ')">คนงานไม่พอ</button>
</div>

<button onclick="save()">💾 บันทึก แล้วคัดลอกส่ง LINE</button>
<div id="ok"></div>

<button class="alt" onclick="xls()">📊 ดาวน์โหลดไฟล์ Excel</button>
<p class="hint" id="count"></p>
<p class="hint">ดาวน์โหลดแล้วระบบจะเริ่มนับใหม่ ไฟล์ครั้งถัดไปจะมีเฉพาะรายงานหลังจากนี้</p>

<script>
const F = ['project','name','date','today','tomorrow','problem'];
const $ = id => document.getElementById(id);

// โหลดค่าที่เคยกรอก
F.forEach(id => {
  $(id).value = localStorage.getItem('dr_' + id) || '';
  $(id).addEventListener('input', () => localStorage.setItem('dr_' + id, $(id).value));
});
if (!$('date').value) $('date').value = new Date().toLocaleDateString('sv');

function setP(t){ $('problem').value = t; localStorage.setItem('dr_problem', t); }

// ---- ประวัติรายงาน ----
const hist = () => JSON.parse(localStorage.getItem('dr_history') || '[]');

function showCount(){
  const n = hist().length;
  $('count').textContent = n ? `มีรายงานเก็บไว้ ${n} วัน` : 'ยังไม่มีรายงานที่บันทึกไว้';
}
showCount();

function save(){
  const row = {};
  F.forEach(id => row[id] = $(id).value);
  if (!row.problem) row.problem = 'ไม่มี';
  const h = hist().filter(r => !(r.date === row.date && r.name === row.name)); // กรอกซ้ำวันเดิม = ทับของเดิม
  h.push(row);
  h.sort((a, b) => a.date.localeCompare(b.date));
  localStorage.setItem('dr_history', JSON.stringify(h));
  showCount();
  copy();
}

// ---- สร้างไฟล์ .xlsx เอง (ไม่ใช้ library ภายนอก) ----
// xlsx = ไฟล์ zip ที่ข้างในเป็น xml หลายไฟล์ จึงเขียน zip แบบไม่บีบอัดขึ้นมาตรง ๆ
const CRCT = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c;
  }
  return t;
})();
const crc32 = u8 => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};

function zip(files){
  const enc = new TextEncoder();
  const b2 = n => [n & 255, (n >> 8) & 255];
  const b4 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  const local = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.data), c = crc32(data);
    const head = [...b4(0x04034b50), ...b2(20), ...b2(0x800), ...b2(0), ...b2(0), ...b2(0),
                  ...b4(c), ...b4(data.length), ...b4(data.length), ...b2(name.length), ...b2(0)];
    local.push(new Uint8Array(head), name, data);
    central.push(new Uint8Array([...b4(0x02014b50), ...b2(20), ...b2(20), ...b2(0x800), ...b2(0),
                  ...b2(0), ...b2(0), ...b4(c), ...b4(data.length), ...b4(data.length),
                  ...b2(name.length), ...b2(0), ...b2(0), ...b2(0), ...b2(0), ...b4(0), ...b4(offset)]), name);
    offset += head.length + name.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new Uint8Array([...b4(0x06054b50), ...b2(0), ...b2(0),
                ...b2(files.length), ...b2(files.length), ...b4(cdSize), ...b4(offset), ...b2(0)]);
  return new Blob([...local, ...central, end], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const esc = v => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/\r?\n/g, '&#10;');

function xls(){
  const h = hist();
  if (!h.length) { alert('ยังไม่มีข้อมูล กด "บันทึก" ก่อนอย่างน้อย 1 ครั้ง'); return; }

  const head = ['วันที่','โครงการ','ผู้รายงาน','สิ่งที่ทำไปวันนี้','สิ่งที่จะทำพรุ่งนี้','ปัญหาที่พบ'];
  const widths = [13, 22, 16, 46, 42, 30];
  const col = i => String.fromCharCode(65 + i);
  const cell = (i, r, s, v) => `<c r="${col(i)}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;

  const rows = [
    `<row r="1" ht="30" customHeight="1">${head.map((v, i) => cell(i, 1, 1, v)).join('')}</row>`,
    ...h.map((r, n) => {
      const band = n % 2;                            // แถวคู่สลับสีอ่อน
      const vals = [r.date, r.project, r.name, r.today, r.tomorrow, r.problem];
      // 2/3 = จัดกลาง (ปกติ/สลับสี), 4/5 = ชิดซ้าย (ปกติ/สลับสี)
      return `<row r="${n + 2}">` + vals.map((v, i) =>
        cell(i, n + 2, (i < 3 ? 2 : 4) + band, v)).join('') + '</row>';
    })
  ].join('');

  const ref = `A1:F${h.length + 1}`;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="${ref}"/>` +
`<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
`<sheetFormatPr defaultRowHeight="16"/><cols>` +
widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') +
`</cols><sheetData>${rows}</sheetData><autoFilter ref="${ref}"/>` +
`<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>` +
`<pageSetup orientation="landscape" fitToWidth="1" paperSize="9"/></worksheet>`;

  const F_ = '<name val="Tahoma"/>';
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
`<fonts count="2"><font><sz val="11"/><color rgb="FF1A1A1A"/>${F_}</font>` +
`<font><b/><sz val="11"/><color rgb="FFFFFFFF"/>${F_}</font></fonts>` +
`<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>` +
`<fill><patternFill patternType="solid"><fgColor rgb="FF1565C0"/><bgColor indexed="64"/></patternFill></fill>` +
`<fill><patternFill patternType="solid"><fgColor rgb="FFEDF3FA"/><bgColor indexed="64"/></patternFill></fill></fills>` +
`<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>` +
`<border>${['left','right','top','bottom'].map(s => `<${s} style="thin"><color rgb="FFC5D0DC"/></${s}>`).join('')}<diagonal/></border></borders>` +
`<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6">` +
`<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>` +
`<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>` +
`<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top" wrapText="1"/></xf>` +
`<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top" wrapText="1"/></xf>` +
`<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>` +
`<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>` +
`</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const blob = zip([
    {name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
`<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
`<Default Extension="xml" ContentType="application/xml"/>` +
`<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
`<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
`<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
`<Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}">` +
`<sheets><sheet name="รายงานประจำวัน" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
`<Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/>` +
`<Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name: 'xl/styles.xml', data: styles},
    {name: 'xl/worksheets/sheet1.xml', data: sheet}
  ]);

  const stamp = new Date().toLocaleString('sv').replace(/[-: ]/g, '').slice(0, 12);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `รายงานประจำวัน_${$('name').value || 'ไม่ระบุชื่อ'}_${stamp}.xlsx`;
  a.click();

  // ส่งออกแล้ว = เริ่มนับใหม่ (ข้อมูลอยู่ในไฟล์ที่เพิ่งโหลดแล้ว)
  localStorage.removeItem('dr_history');
  showCount();
  $('ok').textContent = `✔ ส่งออก ${h.length} วันแล้ว — เริ่มนับใหม่`;
}

function copy(){
  const d = new Date($('date').value).toLocaleDateString('th-TH',
      {day:'numeric', month:'long', year:'numeric'});
  const text =
`รายงานประจำวัน ${d}
โครงการ: ${$('project').value}
ผู้รายงาน: ${$('name').value}

✅ ทำวันนี้
${$('today').value}

📌 พรุ่งนี้
${$('tomorrow').value}

⚠️ ปัญหา
${$('problem').value || 'ไม่มี'}`;
  navigator.clipboard.writeText(text)
    .then(() => { $('ok').textContent = '✔ บันทึกและคัดลอกแล้ว — ไปวางใน LINE ได้เลย'; })
    .catch(() => { prompt('คัดลอกข้อความนี้:', text); });
}
</script>

</body>
</html>
